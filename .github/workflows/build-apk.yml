name: Construir APK Matibatidos

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar estructura del proyecto
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

      - name: Preparar archivos de recursos
        run: mkdir -p app/src/main/assets

      - name: Descargar SheetJS
        run: |
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output app/src/main/assets/xlsx.full.min.js
          test -s app/src/main/assets/xlsx.full.min.js

      - name: Descargar Chart.js
        run: |
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js \
            --output app/src/main/assets/chart.umd.min.js
          test -s app/src/main/assets/chart.umd.min.js

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
